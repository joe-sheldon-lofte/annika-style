<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio | Annika May Hair Stylist</title>
    
    <!-- Google Fonts: Italiana for headings & Outfit for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0D1013;
            --bg-card: #15191D;
            --text-light: #FFFFFF;
            --text-muted: #B0B8C0;
            --accent-glow: #88C0D0;
            --border-glow: rgba(136, 192, 208, 0.25);
            --font-display: 'Italiana', serif;
            --font-body: 'Outfit', sans-serif;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            font-family: var(--font-body); 
            font-weight: 300;
            line-height: 1.6; 
            padding-top: 80px; /* Account for fixed header height */
            -webkit-font-smoothing: antialiased; 
        }

        h1, h2, h3, h4 { 
            font-family: var(--font-display); 
            font-weight: 400; 
            letter-spacing: 0.02em;
        }

        .container { 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 1.5rem; 
        }
        
        /* Fixed Liquid Glass Header */
        header { 
            position: fixed; 
            top: 0; 
            left: 0;
            right: 0;
            width: 100%;
            background: rgba(13, 16, 19, 0.65); 
            backdrop-filter: blur(20px) saturate(180%); 
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            z-index: 1000; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 1.25rem 0; 
        }

        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .logo { 
            font-family: var(--font-display); 
            font-size: 2.2rem; 
            text-decoration: none; 
            color: var(--text-light); 
            letter-spacing: 0.12em; 
            text-transform: uppercase; 
        }

        .nav-links { 
            display: flex; 
            gap: 2rem; 
            list-style: none; 
            align-items: center; 
        }

        .nav-links a { 
            text-decoration: none; 
            color: var(--text-muted); 
            font-size: 0.95rem; 
            transition: color 0.3s ease; 
        }

        .nav-links a:hover { 
            color: var(--accent-glow); 
        }

        .btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            background: linear-gradient(135deg, #88C0D0, #81A1C1); 
            color: #0D1013; 
            padding: 0.8rem 1.8rem; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 0.9rem; 
            border: none; 
            cursor: pointer; 
            transition: all 0.3s ease; 
        }

        .btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(136, 192, 208, 0.3); 
        }

        .btn-outline { 
            background: transparent; 
            color: var(--text-light); 
            border: 1px solid var(--border-glow); 
        }

        .btn-outline:hover { 
            background: rgba(255, 255, 255, 0.05); 
            border-color: var(--accent-glow); 
            color: var(--accent-glow); 
        } 
        
        /* Header Title Area */
        .page-header { 
            text-align: center; 
            padding: 3rem 0 2rem 0; 
        }

        .page-header h1 { 
            font-size: 4rem; 
            margin-bottom: 0.5rem; 
            color: #FFFFFF;
        }

        .page-header p { 
            color: var(--text-muted); 
            font-size: 1.1rem; 
            font-weight: 300;
        }

        /* Filter Controls */
        .filter-bar { 
            display: flex; 
            justify-content: center; 
            gap: 0.75rem; 
            margin-bottom: 3.5rem; 
            flex-wrap: wrap; 
        }

        .filter-btn { 
            background: var(--bg-card); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: var(--text-muted); 
            padding: 0.6rem 1.5rem; 
            border-radius: 50px; 
            font-family: var(--font-body); 
            font-size: 0.9rem; 
            font-weight: 300;
            cursor: pointer; 
            transition: all 0.3s ease; 
        }

        .filter-btn.active, .filter-btn:hover { 
            background: linear-gradient(135deg, #88C0D0, #81A1C1); 
            color: #0D1013; 
            border-color: transparent; 
            font-weight: 500; 
        }

        /* Gallery Grid */
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 2rem; 
            min-height: 400px; 
        }

        .gallery-item { 
            background: var(--bg-card); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 16px; 
            overflow: hidden; 
            transition: all 0.4s ease; 
        }

        .gallery-item:hover { 
            transform: translateY(-6px); 
            border-color: var(--border-glow); 
        }

        .gallery-item img { 
            width: 100%; 
            height: 380px; 
            object-fit: cover; 
            display: block; 
        }

        .gallery-item-info { 
            padding: 1.5rem; 
            background: linear-gradient(180deg, rgba(21,25,29,0.8) 0%, rgba(21,25,29,1) 100%); 
        }

        .gallery-item-info h4 { 
            font-size: 1.4rem; 
            margin-bottom: 0.25rem; 
        }

        .gallery-item-info p { 
            font-size: 0.8rem; 
            color: var(--accent-glow); 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            font-weight: 400;
        }

        /* Pagination Bar */
        .pagination { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 1.5rem; 
            margin: 4rem 0 6rem 0; 
        }

        .page-info { 
            font-size: 0.95rem; 
            color: var(--text-muted); 
        }

        .pagination button:disabled { 
            opacity: 0.3; 
            cursor: not-allowed; 
            transform: none; 
            box-shadow: none; 
        }

        footer { 
            background-color: #080A0C; 
            padding: 3rem 0; 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            border-top: 1px solid rgba(255, 255, 255, 0.05); 
        }

        @media (max-width: 768px) {
            body {
                padding-top: 110px;
            }
            nav { 
                flex-direction: column; 
                gap: 0.75rem; 
            }
            .logo {
                font-size: 1.8rem;
            }
            .page-header h1 { 
                font-size: 2.8rem; 
            }
            .gallery-grid { 
                grid-template-columns: 1fr; 
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">ANNIKA MAY</a>
                <ul class="nav-links">
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="portfolio.html" style="color: var(--accent-glow);">Work</a></li>
                    <li><a href="index.html#updates">Updates</a></li>
                    <li><a href="index.html#contact" class="btn btn-outline" style="padding: 0.5rem 1.25rem;">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Page Title -->
    <section class="page-header">
        <div class="container">
            <h1>Transformations &amp; Gallery</h1>
            <p>Explore recent highlights, dimensional blondes, precision cuts, and styling.</p>
        </div>
    </section>

    <!-- Gallery Container -->
    <section class="container">
        <!-- Filter Controls -->
        <div class="filter-bar">
            <button class="filter-btn active" data-category="All">All Work</button>
            <button class="filter-btn" data-category="Color">Color &amp; Blonding</button>
            <button class="filter-btn" data-category="Cut">Precision Cuts</button>
            <button class="filter-btn" data-category="Styling">Styling &amp; Blowouts</button>
        </div>

        <!-- Dynamic Photo Grid -->
        <div class="gallery-grid" id="full-portfolio-grid"></div>

        <!-- Pagination Controls -->
        <div class="pagination">
            <button class="btn btn-outline" id="prev-btn">&larr; Previous</button>
            <span class="page-info" id="page-info">Page 1 of 1</span>
            <button class="btn btn-outline" id="next-btn">Next &rarr;</button>
        </div>
    </section>

    <footer>
        <div class="container">
            &copy; 2026 Annika May. All rights reserved.
        </div>
    </footer>

    <!-- Interactive Script (with Cache Busting) -->
    <script>
        const ITEMS_PER_PAGE = 10;
        let allPhotos = [];
        let filteredPhotos = [];
        let currentPage = 1;

        document.addEventListener('DOMContentLoaded', () => {
            fetch('./gallery.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    if (data && data.photos) {
                        allPhotos = [...data.photos].reverse();
                        filteredPhotos = allPhotos;
                        renderGallery();
                    }
                })
                .catch(err => console.log('Waiting for initial CMS photos...'));

            // Filter logic
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');

                    const category = e.target.getAttribute('data-category');
                    if (category === 'All') {
                        filteredPhotos = allPhotos;
                    } else {
                        filteredPhotos = allPhotos.filter(p => p.category === category);
                    }

                    currentPage = 1;
                    renderGallery();
                });
            });

            // Pagination button logic
            document.getElementById('prev-btn').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderGallery();
                    window.scrollTo({ top: 200, behavior: 'smooth' });
                }
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                const totalPages = Math.ceil(filteredPhotos.length / ITEMS_PER_PAGE) || 1;
                if (currentPage < totalPages) {
                    currentPage++;
                    renderGallery();
                    window.scrollTo({ top: 200, behavior: 'smooth' });
                }
            });
        });

        function renderGallery() {
            const grid = document.getElementById('full-portfolio-grid');
            const totalPages = Math.ceil(filteredPhotos.length / ITEMS_PER_PAGE) || 1;
            
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageItems = filteredPhotos.slice(start, end);

            if (pageItems.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 4rem 0;">No photos uploaded in this category yet.</p>`;
            } else {
                grid.innerHTML = pageItems.map(item => `
                    <div class="gallery-item">
                        <img src="${item.image}" alt="${item.caption || 'Hair Transformation'}">
                        <div class="gallery-item-info">
                            <h4>${item.caption || 'Hair Transformation'}</h4>
                            <p>${item.category || 'Styling'}</p>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prev-btn').disabled = (currentPage === 1);
            document.getElementById('next-btn').disabled = (currentPage >= totalPages);
        }
    </script>
</body>
</html>
